version: 1
defaults:
  ecosystems:
  - package-ecosystem: github-actions
    commit-message:
      prefix: 'deps(actions):'
  - package-ecosystem: npm
    versioning-strategy: widen
    ignore:
    - dependency-name: typescript
      update-types:
      - version-update:semver-major
    - dependency-name: '@types/node'
      update-types:
      - version-update:semver-major
    commit-message:
      prefix: 'deps(npm):'
