name: Release on tag

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit semantic version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: '[[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

  verify:
    needs: validate-tag
    uses: ./.github/workflows/build-and-push.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run ci
      - name: Require the qualified distribution
        run: git diff --quiet --exit-code -- dist
      - name: Update moving major tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          git tag -f "v${MAJOR}" "$GITHUB_REF_NAME"
          git push -f origin "v${MAJOR}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
