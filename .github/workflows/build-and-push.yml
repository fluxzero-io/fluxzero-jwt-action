name: Build and push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  runtime:
    name: Action runtime
    uses: ./.github/workflows/action-runtime.yml
    with:
      # The isolated bot merge job can commit the tested bundle, then queue a
      # merge only after fresh CI verifies that committed distribution.
      check-dist: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]') }}

  gate:
    name: JWT Action required checks
    if: always()
    needs: [verify, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported builds and the actual action runtime
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DISTRIBUTION_CLEAN: ${{ needs.runtime.outputs.distribution-clean }}
        run: test "$BUILD_RESULT" = success && test "$RUNTIME_RESULT" = success && test "$DISTRIBUTION_CLEAN" = true

  auto-merge:
    name: Merge dependency
    if: >-
      always() && needs.verify.result == 'success' && needs.runtime.result == 'success' &&
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    needs: [verify, runtime, gate]
    uses: ./.github/workflows/dependabot-auto-merge.yml
    secrets: inherit
