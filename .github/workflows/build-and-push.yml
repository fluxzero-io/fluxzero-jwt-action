name: Build and push

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: autobuild-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run ci

      - name: Commit dist directory if changed
        run: |
          set -euo pipefail
          git add --intent-to-add -- dist/
          if ! git diff --quiet dist; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- dist/
            git commit -m "build: update dist for ${GITHUB_SHA::7} [skip ci]"
            git push
          else
            echo "No changes in dist directory"
          fi
