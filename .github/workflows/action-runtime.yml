name: Action runtime

on:
  workflow_call:
    inputs:
      check-dist:
        type: boolean
        default: true
    outputs:
      distribution-clean:
        value: ${{ jobs.token-mode.outputs.distribution-clean }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      distribution-clean: ${{ steps.distribution.outputs.clean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install, test, and rebuild
        run: |
          npm ci
          npm run lint
          npm run ci

      - name: Verify committed action distribution
        id: distribution
        env:
          REQUIRE_COMMITTED_DIST: ${{ inputs.check-dist || github.event_name == 'workflow_dispatch' }}
        run: |
          if git diff --quiet --exit-code -- dist; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            if [[ "$REQUIRE_COMMITTED_DIST" == true ]]; then
              echo '::error::Rebuild and commit the action distribution.'
              exit 1
            fi
          fi

      - name: Create ephemeral API key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_key_path="${RUNNER_TEMP}/jwt-action-test-private.pem"
          public_key_path="${RUNNER_TEMP}/jwt-action-test-public.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            > "${private_key_path}" 2>/dev/null
          openssl pkey -in "${private_key_path}" -pubout \
            > "${public_key_path}" 2>/dev/null
          private_key="$(openssl pkcs8 -topk8 -nocrypt -in "${private_key_path}" \
            -outform DER 2>/dev/null | base64 | tr -d '\n')"
          api_key="$(jq -cn \
            --arg userId 'jwt-action-workflow-user' \
            --arg keyId 'jwt-action-workflow-key' \
            --arg key "${private_key}" \
            --arg issuedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{userId: $userId, keyId: $keyId, key: $key, issuedAt: $issuedAt}')"
          echo "::add-mask::${private_key}"
          echo "::add-mask::${api_key}"
          {
            echo "TEST_API_KEY=${api_key}"
            echo "JWT_PUBLIC_KEY_PATH=${public_key_path}"
            echo "JWT_EARLIEST_ISSUED_AT=$(date +%s)"
          } >> "${GITHUB_ENV}"

      - name: Generate JWT with the checked-out action
        id: jwt
        uses: ./
        with:
          mode: token
          api-key: ${{ env.TEST_API_KEY }}
          validity-seconds: 120

      - name: Verify JWT without disclosing credentials
        env:
          JWT_TOKEN: ${{ steps.jwt.outputs.token }}
          JWT_EXPECTED_USER_ID: jwt-action-workflow-user
          JWT_EXPECTED_KEY_ID: jwt-action-workflow-key
          JWT_VALIDITY_SECONDS: 120
        run: node test/verify-action-token.mjs

      - name: Retain the tested distribution for a native Dependabot PR
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jwt-action-distribution-${{ github.sha }}
          path: |
            dist/index.js
            dist/licenses.txt
          retention-days: 1
          if-no-files-found: error
